<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Volviendo a la app — Che, Clima</title>
  <link rel="icon" type="image/png" href="icono-64.png">
  <link rel="apple-touch-icon" href="icono-180.png">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eef3fa; color: #14213d;
           font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 16px; }
    @media (prefers-color-scheme: dark) { body { background: #0d1424; color: #e8eefb; } a { color: #7fb0ff; } }
    a { color: #1f5fbf; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <p style="font-size:40px;margin:0">☂️</p>
    <p id="mensaje">Volviendo a la app…</p>
    <p id="manual" hidden><a id="link" href="#">Tocá acá si no vuelve sola</a></p>
  </main>
  <script>
    // Página "puente" del inicio de sesión con Google.
    // Supabase vuelve acá (siempre acepta su dirección principal) con un código de
    // un solo uso, y esta página lo reenvía a la app que lo pidió.
    // Solo reenvía a la app (exp:// en pruebas con Expo Go, paraguasono:// en la app final).
    // El código no sirve sin la clave que quedó guardada en el celular que lo pidió.
    (function () {
      var params = new URLSearchParams(location.search);
      var app = params.get('app') || '';
      if (!/^(exp|exps|paraguasono):\/\//.test(app)) {
        document.getElementById('mensaje').textContent = 'Este link es para volver a la app Che, Clima.';
        return;
      }
      params.delete('app');
      var resto = params.toString();
      var destino = app + (resto ? (app.indexOf('?') >= 0 ? '&' : '?') + resto : '') + location.hash;
      document.getElementById('link').href = destino;
      location.replace(destino);
      setTimeout(function () { document.getElementById('manual').hidden = false; }, 1500);
    })();
  </script>
</body>
</html>
